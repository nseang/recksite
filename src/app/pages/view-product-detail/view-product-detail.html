<div class="bg-gray-300 p-6 h-full">

	<div class="p-6">
		<app-back-button label="Continue Shopping" navigateTo="/products/all"></app-back-button>
	</div>

	<div class="mx-auto max-w-[1200px] py-6">
		@if (product.id) {
			<div class="flex gap-8 mb-8">
				<img [src]="product.imageUrl" class="w-[500px] h-[550px] object-scale-down rounded-lg" [style.view-transition-name]="'product-image-' + product.id" >
				<div class=" flex-1">
					<app-product-info [product]="product"/>

				</div>
			</div>
		}
	</div>

</div>
